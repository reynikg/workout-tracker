<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Workout Tracker — Legal</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wt.theme') || 'ocean';
        var m = localStorage.getItem('wt.mode') || 'system';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-resolved', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="legal-page">
    <a class="legal-back" href="index.html">‹ Back to app</a>
    <h1 id="doc-title">Legal</h1>
    <div class="legal-updated" id="doc-updated"></div>
    <div class="legal-body" id="doc-body"></div>
    <nav class="legal-nav" id="doc-nav"></nav>
  </div>

  <script src="legal.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var key = params.get('doc') || 'privacy';
      if (!LEGAL[key]) key = 'privacy';
      var doc = LEGAL[key];
      document.title = 'Workout Tracker — ' + doc.title;
      document.getElementById('doc-title').textContent = doc.title;
      document.getElementById('doc-updated').textContent = 'Last updated ' + LEGAL_UPDATED;
      document.getElementById('doc-body').innerHTML = doc.body;
      document.getElementById('doc-nav').innerHTML = Object.keys(LEGAL)
        .filter(function (k) { return k !== key; })
        .map(function (k) { return '<a href="legal.html?doc=' + k + '">' + LEGAL[k].title + '</a>'; })
        .join('');
    })();
  </script>
</body>
</html>
